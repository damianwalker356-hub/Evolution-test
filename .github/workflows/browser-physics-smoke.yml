name: Creature physics and source-scope checks
on:
  push:
    branches: [browser-simulator]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  creature-physics-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify audit behavior
        run: python3 audit_creature_scope_test.py
      - name: Audit tracked source and baseline boundary
        run: python3 audit_creature_scope.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check creature control rules and PhysX startup
        run: npm test
